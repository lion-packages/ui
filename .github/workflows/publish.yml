name: Lion-UI (CI Workflow Publish)

on:
  release:
    types: [published]

permissions:
  checks: write
  contents: read
  deployments: write
  statuses: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish (NPM)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Commit check (pending)
        uses: ./.github/actions/commit-check
        with:
          status: pending
          context: NPM
          description: Publish in progress.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Compile library
        run: npm run publish:build

      - name: Publish to NPM
        run: npm run publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit check (success)
        uses: ./.github/actions/commit-check
        with:
          status: completed
          conclusion: success
          context: NPM
          description: Publish has completed.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit check (failure)
        if: failure()
        uses: ./.github/actions/commit-check
        with:
          status: completed
          conclusion: failure
          context: NPM
          description: The publish has failed.
          token: ${{ secrets.GITHUB_TOKEN }}