name: Lion-UI (CI Workflow Deploy)

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish (NPM)
    steps:
      - name: Commit check (pending)
        uses: ./.github/actions/commit-check
        with:
          status: pending
          context: Deploy
          description: Deploy in progress.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: curl ${{ secrets.VERCEL_DEPLOY_HOOK_KEY }}

      - name: Commit check (success)
        uses: ./.github/actions/commit-check
        with:
          status: completed
          conclusion: success
          context: Deploy
          description: Deploy has completed.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit check (failure)
        if: failure()
        uses: ./.github/actions/commit-check
        with:
          status: completed
          conclusion: failure
          context: Deploy
          description: The deploy has failed.
          token: ${{ secrets.GITHUB_TOKEN }}